<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CLB Cơ điện tử</title>
  <meta name="description" content="Sơ đồ tương tác Câu lạc bộ Cơ điện tử" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="viewer" aria-label="Sơ đồ nhân sự CLB Cơ điện tử">
    <div class="poster-shell">
      <div class="poster-stage" id="posterStage">
        <img src="assets/clb-map.png" alt="Sơ đồ tổ chức Câu lạc bộ Cơ điện tử" />
        <div id="hotspots" class="hotspots" aria-label="Các vị trí có thể xem thông tin"></div>
      </div>
    </div>
  </main>

  <div class="modal" id="profileModal" aria-hidden="true">
    <div class="modal-backdrop" data-close="modal"></div>
    <article class="profile-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-btn" type="button" aria-label="Đóng" data-close="modal">×</button>
      <div class="scroll-rod top"></div>
      <div class="scroll-paper">

        <section id="profileView" class="modal-view">
          <div class="profile-head">
            <div class="avatar" id="profileAvatar">TS</div>
            <div class="profile-head-text">
              <div class="profile-kicker" id="profileGroup"></div>
              <h2 id="profileName"></h2>
              <p class="profile-role" id="profileRole"></p>
            </div>
          </div>

          <dl class="profile-grid">
            <div>
              <dt>Chức vụ</dt>
              <dd id="profilePosition"></dd>
            </div>
            <div>
              <dt>Học hàm</dt>
              <dd id="profileAcademicRank"></dd>
            </div>
            <div>
              <dt>Học vị</dt>
              <dd id="profileDegree"></dd>
            </div>
            <div>
              <dt>Email</dt>
              <dd id="profileEmail"></dd>
            </div>
            <div class="wide">
              <dt>Phụ trách</dt>
              <dd id="profileResponsibility"></dd>
            </div>
          </dl>
        </section>

        <section id="memberView" class="modal-view hidden">
          <div class="member-head">
            <div class="member-kicker" id="memberGroup"></div>
            <h2 id="memberTitle"></h2>
          </div>

          <div class="member-table-wrap">
            <table class="member-table">
              <thead>
                <tr>
                  <th>STT</th>
                  <th>Họ và tên</th>
                  <th>Lớp</th>
                </tr>
              </thead>
              <tbody id="memberTableBody"></tbody>
            </table>
          </div>
        </section>

      </div>
      <div class="scroll-rod bottom"></div>
    </article>
  </div>

  <script src="app.js"></script>
</body>
</html>
